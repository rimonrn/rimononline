<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>আমার স্টক</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b8a5f">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f8f6;--surface:#fff;--text:#13261d;--muted:#5c7569;--accent:#0b8a5f;--accent-text:#fff;--border:#dbe9e1;--good:#0a8f4e;--warn:#c27a00;--bad:#d93a3a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1511;--surface:#13221b;--text:#e7f3ec;--muted:#93b0a1;--accent:#3ed08a;--accent-text:#06210f;--border:#21372c;--good:#3ed08a;--warn:#f2b640;--bad:#ff7a7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1511;--surface:#13221b;--text:#e7f3ec;--muted:#93b0a1;--accent:#3ed08a;--accent-text:#06210f;--border:#21372c;--good:#3ed08a;--warn:#f2b640;--bad:#ff7a7a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Noto Sans Bengali","Hind Siliguri",sans-serif;line-height:1.5;padding-bottom:calc(74px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px}
h1{font-size:21px;margin:2px 0 12px}
h2{font-size:16px;margin:16px 0 8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center}
.st b{display:block;font-size:19px}.st span{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card h3{margin:0;font-size:16px}.card p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap;border:1px solid currentColor}
.ok{color:var(--good)}.low{color:var(--warn)}.out{color:var(--bad)}
.acts{display:flex;gap:8px;margin-top:10px}
.btn{border:0;background:var(--accent);color:var(--accent-text);font:inherit;font-weight:600;border-radius:10px;padding:10px 14px;cursor:pointer;flex:1;font-size:14px}
.btn.alt{background:none;color:var(--text);border:1px solid var(--border)}
.btn.sm{padding:7px 12px;font-size:13px;flex:none}
input,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit;font-size:15px}
textarea{min-height:110px;font-size:12px}
.fld{margin-bottom:10px}.fld label{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-bottom:6px}
.r2{display:flex;gap:8px}
.empty{text-align:center;color:var(--muted);padding:26px 0}
.log{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px}
.log small{color:var(--muted);display:block;font-size:12px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:12px;padding:4px 0;cursor:pointer}
nav button span{display:block;font-size:22px;line-height:1.2}nav button.on{color:var(--accent);font-weight:700}
dialog{border:0;border-radius:16px;padding:18px;width:min(92vw,420px);background:var(--surface);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.55)}dialog h3{margin:0 0 12px}
.note{font-size:12px;color:var(--muted);margin-top:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<h1>📦 আমার স্টক</h1>
<section id="v1"></section>
<section id="v2" hidden></section>
<section id="v3" hidden></section>
</div>
<nav id="nav">
<button data-v="1" class="on"><span>🏠</span>হোম</button>
<button data-v="2"><span>📦</span>স্টক</button>
<button data-v="3"><span>🧾</span>ইতিহাস</button>
</nav>
<dialog id="dlg"><div id="dbody"></div></dialog>
<script>
var $=function(i){return document.getElementById(i)};
function mk(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function bn(n){return Math.round(n).toLocaleString("bn-BD")}
var db={p:[],h:[]},view=1,query="";
try{var x=JSON.parse(localStorage.getItem("stockDB")||"null");if(x&&x.p&&x.h)db=x}catch(e){}
function save(){try{localStorage.setItem("stockDB",JSON.stringify(db))}catch(e){}}
function num(v){var n=parseFloat(v);return isFinite(n)?n:NaN}
function st(p){return p.q<=0?["out","স্টক শেষ"]:p.q<=p.low?["low","কম স্টক"]:["ok","স্টকে আছে"]}

function ask(title,fs,ok,okText){
 var d=$("dlg"),b=$("dbody"),inp={};b.textContent="";b.appendChild(mk("h3","",title));
 fs.forEach(function(f){var w=mk("div","fld");w.appendChild(mk("label","",f.l));
  var i=mk(f.t==="area"?"textarea":"input");if(f.t==="num"){i.type="number";i.inputMode="decimal"}
  if(f.v!==undefined)i.value=f.v;inp[f.k]=i;w.appendChild(i);b.appendChild(w)});
 var err=mk("div","err");b.appendChild(err);
 var r=mk("div","r2"),c=mk("button","btn alt","বাতিল"),o=mk("button","btn",okText||"সেভ");
 c.onclick=function(){d.close()};
 o.onclick=function(){var v={};for(var k in inp)v[k]=inp[k].value;var m=ok(v);if(m){err.textContent=m}else{save();d.close();draw()}};
 r.appendChild(c);r.appendChild(o);b.appendChild(r);d.showModal();
 var f0=b.querySelector("input,textarea");if(f0&&!f0.readOnly&&f0.tagName==="INPUT")f0.focus()}

function pForm(p){return[
 {k:"n",l:"প্রোডাক্টের নাম",v:p?p.n:""},{k:"c",l:"ক্রয়মূল্য (৳)",t:"num",v:p?p.c:""},
 {k:"s",l:"বিক্রয়মূল্য (৳)",t:"num",v:p?p.s:""},{k:"q",l:"বর্তমান স্টক (পিস)",t:"num",v:p?p.q:""},
 {k:"low",l:"কত পিসের নিচে নামলে সতর্ক করবে",t:"num",v:p?p.low:3}]}
function pCheck(v){var c=num(v.c),s=num(v.s),q=num(v.q),l=num(v.low);
 if(!v.n.trim())return"নাম লিখুন";if(isNaN(c)||isNaN(s)||isNaN(q)||isNaN(l)||c<0||s<0||q<0||l<0)return"সব ঘরে সঠিক সংখ্যা দিন";return""}
function addP(){ask("নতুন প্রোডাক্ট",pForm(),function(v){var e=pCheck(v);if(e)return e;
 var p={id:Date.now(),n:v.n.trim(),c:num(v.c),s:num(v.s),q:num(v.q),low:num(v.low)};db.p.push(p);
 if(p.q>0)db.h.push({t:Date.now(),y:"in",n:p.n,q:p.q,a:p.q*p.c})})}
function editP(p){ask("এডিট: "+p.n,pForm(p),function(v){var e=pCheck(v);if(e)return e;
 p.n=v.n.trim();p.c=num(v.c);p.s=num(v.s);p.q=num(v.q);p.low=num(v.low)})}
function delP(p){ask("“"+p.n+"” মুছবেন?",[],function(){db.p=db.p.filter(function(x){return x.id!==p.id})},"হ্যাঁ, মুছুন")}
function stockIn(p){ask("স্টক যোগ: "+p.n,[{k:"q",l:"নতুন কত পিস এনেছেন",t:"num"},{k:"c",l:"এই চালানের ক্রয়মূল্য (প্রতি পিস ৳)",t:"num",v:p.c}],function(v){
 var q=num(v.q),c=num(v.c);if(isNaN(q)||q<=0||isNaN(c)||c<0)return"সঠিক সংখ্যা দিন";
 p.q+=q;p.c=c;db.h.push({t:Date.now(),y:"in",n:p.n,q:q,a:q*c})})}
function sell(p){ask("বিক্রি: "+p.n+" (স্টকে "+bn(p.q)+")",[{k:"q",l:"কত পিস বিক্রি",t:"num",v:1},{k:"s",l:"বিক্রয়মূল্য (প্রতি পিস ৳)",t:"num",v:p.s}],function(v){
 var q=num(v.q),s=num(v.s);if(isNaN(q)||q<=0||isNaN(s)||s<0)return"সঠিক সংখ্যা দিন";
 if(q>p.q)return"স্টকে মাত্র "+bn(p.q)+" পিস আছে";
 p.q-=q;db.h.push({t:Date.now(),y:"sell",n:p.n,q:q,a:q*s,pr:q*(s-p.c)})},"বিক্রি নিশ্চিত")}
function backup(){ask("ব্যাকআপ ও রিস্টোর",[{k:"j",l:"নিচের লেখাটা কপি করে নিরাপদ জায়গায় (যেমন WhatsApp-এ নিজের নম্বরে) রাখুন। রিস্টোর করতে এখানে পেস্ট করুন।",t:"area",v:JSON.stringify(db)}],function(v){
 try{var x=JSON.parse(v.j);if(!x||!Array.isArray(x.p)||!Array.isArray(x.h))return"ব্যাকআপ ঠিক নেই";db=x}catch(e){return"ব্যাকআপ ঠিক নেই"}},"রিস্টোর করুন")}
function sample(){var n=Date.now();db.p=[{id:n,n:"পাওয়ার ব্যাংক ১০০০০mAh",c:900,s:1300,q:12,low:3},{id:n+1,n:"ওয়্যারলেস ইয়ারবাড",c:700,s:1100,q:2,low:3},{id:n+2,n:"স্মার্ট ওয়াচ",c:1500,s:2200,q:0,low:2}];save();draw()}

function card(p,full){
 var s=st(p),c=mk("div","card"),t=mk("div","top"),l=mk("div");
 l.appendChild(mk("h3","",p.n));l.appendChild(mk("p","","স্টক: "+bn(p.q)+" পিস · ক্রয় ৳"+bn(p.c)+" · বিক্রয় ৳"+bn(p.s)));
 t.appendChild(l);t.appendChild(mk("span","badge "+s[0],s[1]));c.appendChild(t);
 var a=mk("div","acts"),b1=mk("button","btn","+ স্টক");b1.onclick=function(){stockIn(p)};a.appendChild(b1);
 if(full){var b2=mk("button","btn","বিক্রি");b2.disabled=p.q<=0;if(p.q<=0)b2.style.opacity=".4";b2.onclick=function(){sell(p)};a.appendChild(b2);
  var b3=mk("button","btn alt sm","এডিট");b3.onclick=function(){editP(p)};a.appendChild(b3);
  var b4=mk("button","btn alt sm","মুছুন");b4.onclick=function(){delP(p)};a.appendChild(b4)}
 c.appendChild(a);return c}
function stat(box,v,l){var d=mk("div","st");d.appendChild(mk("b","",v));d.appendChild(mk("span","",l));box.appendChild(d)}

function drawHome(){
 var v=$("v1");v.textContent="";
 if(!db.p.length){v.appendChild(mk("div","empty","এখনও কোনো প্রোডাক্ট নেই"));
  var a=mk("button","btn","+ প্রথম প্রোডাক্ট যোগ করুন");a.onclick=addP;v.appendChild(a);
  var b=mk("button","btn alt","নমুনা ডেটা দিয়ে দেখুন");b.style.marginTop="8px";b.style.width="100%";b.onclick=sample;v.appendChild(b);return}
 var today=new Date().toDateString(),rev=0,pr=0,val=0;
 db.h.forEach(function(h){if(h.y==="sell"&&new Date(h.t).toDateString()===today){rev+=h.a;pr+=h.pr}});
 db.p.forEach(function(p){val+=p.q*p.c});
 var out=db.p.filter(function(p){return p.q<=0}),low=db.p.filter(function(p){return p.q>0&&p.q<=p.low});
 var g=mk("div","stats");stat(g,bn(db.p.length),"মোট প্রোডাক্ট");stat(g,"৳"+bn(val),"স্টকের মোট ক্রয়মূল্য");stat(g,"৳"+bn(rev),"আজকের বিক্রি");stat(g,(pr<0?"−":"")+"৳"+bn(Math.abs(pr)),"আজকের লাভ");v.appendChild(g);
 var al=out.concat(low);
 v.appendChild(mk("h2","","⚠️ সতর্কতা ("+bn(out.length)+" শেষ, "+bn(low.length)+" কম)"));
 if(!al.length)v.appendChild(mk("div","empty","সব প্রোডাক্টের স্টক ঠিক আছে ✅"));
 al.forEach(function(p){v.appendChild(card(p,false))})}

function drawStock(){
 var v=$("v2");v.textContent="";
 var a=mk("button","btn","+ নতুন প্রোডাক্ট");a.onclick=addP;a.style.width="100%";v.appendChild(a);
 var q=mk("input");q.type="search";q.placeholder="প্রোডাক্ট খুঁজুন…";q.value=query;q.style.margin="10px 0";
 q.oninput=function(){query=q.value;drawList()};v.appendChild(q);
 var l=mk("div");l.id="plist";v.appendChild(l);drawList()}
function drawList(){
 var l=$("plist");if(!l)return;l.textContent="";var s=query.trim().toLowerCase();
 var r=db.p.filter(function(p){return!s||p.n.toLowerCase().indexOf(s)>=0});
 if(!r.length)l.appendChild(mk("div","empty","কিছু পাওয়া যায়নি"));
 r.forEach(function(p){l.appendChild(card(p,true))})}

function drawHist(){
 var v=$("v3");v.textContent="";
 var b=mk("button","btn alt","💾 ব্যাকআপ / রিস্টোর");b.style.width="100%";b.onclick=backup;v.appendChild(b);
 v.appendChild(mk("h2","","সাম্প্রতিক হিসাব"));
 if(!db.h.length)v.appendChild(mk("div","empty","এখনও কোনো হিসাব নেই"));
 db.h.slice(-60).reverse().forEach(function(h){
  var r=mk("div","log"),l=mk("div"),d=new Date(h.t);
  l.appendChild(mk("span","",(h.y==="sell"?"বিক্রি: ":"স্টক ইন: ")+h.n+" × "+bn(h.q)));
  l.appendChild(mk("small","",d.toLocaleDateString("bn-BD")+" "+d.toLocaleTimeString("bn-BD",{hour:"2-digit",minute:"2-digit"})));
  var rt=mk("div");rt.style.textAlign="right";
  rt.appendChild(mk("span",h.y==="sell"?"ok":"","৳"+bn(h.a)));
  if(h.y==="sell"){var sm=mk("small","","লাভ "+(h.pr<0?"−":"")+"৳"+bn(Math.abs(h.pr)));rt.appendChild(sm)}
  r.appendChild(l);r.appendChild(rt);v.appendChild(r)});
 v.appendChild(mk("div","note","ডেটা শুধু এই ফোনের ব্রাউজারে সেভ থাকে। ব্রাউজারের ডেটা মুছলে হারিয়ে যাবে, তাই নিয়মিত ব্যাকআপ রাখুন।"))}

function draw(){
 ["1","2","3"].forEach(function(i){$("v"+i).hidden=String(view)!==i});
 if(view===1)drawHome();else if(view===2)drawStock();else drawHist()}
$("nav").onclick=function(e){var b=e.target.closest("button");if(!b)return;view=+b.dataset.v;
 document.querySelectorAll("nav button").forEach(function(x){x.classList.toggle("on",x===b)});draw()};
draw();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
</body>
</html>
